[package]
name = "authz-history-semantic-binding-exp"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "EXP-D3-01: authorization history to GR/RR semantic binding, three independent computation paths and adversarial tests"
license = "MIT OR Apache-2.0"

[dependencies]
sha2 = "=0.10.9"
hex = "=0.4.3"
halo2_proofs = { version = "=0.4.0", default-features = false, features = ["batch", "floor-planner-v1-legacy-pdqsort"] }
halo2_gadgets = { version = "=0.6.0", default-features = false }
halo2_poseidon = "=0.2.0"
pasta_curves = { version = "=0.6.0", features = ["glv"] }
ff = "0.14"
group = "0.14"
rand = { version = "0.10", features = ["sys_rng", "std_rng"] }
blake2b_simd = { version = "1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = { version = "=2.1.1", default-features = false }

[profile.release]
opt-level = 3
